<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="qexus lab · Norwegian fisheries employment research and self-study, public registry research and private browser-only study workspace" />
  <title>qexus lab · Norway fisheries</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="styles.css" />
<style>
.qexus-home{color:inherit;text-decoration:none}.qexus-home:hover{text-decoration:underline;text-underline-offset:4px}
.country-switch{display:flex;align-items:center;gap:5px;letter-spacing:0}
.country-switch a{display:inline-flex;gap:5px;align-items:center;white-space:nowrap;border:1px solid #c8dfe4;border-radius:10px;padding:8px 11px;color:#3b6a7a;font-weight:750;font-size:12px;text-decoration:none;letter-spacing:0}
.country-switch a:hover{background:#e9f7f5;border-color:#45bcae}
.country-switch a[aria-current="page"]{background:#e0f7f2;border-color:#21af9c;color:#087464}
.country-switch a:focus-visible,.qexus-home:focus-visible{outline:2px solid #13a899;outline-offset:3px}
@media(max-width:820px){.country-switch a{font-size:10px;padding:7px 8px}.version-pill{display:none}}
@media(max-width:430px){.topbar{gap:7px;padding:0 11px}.country-switch{gap:3px}.country-switch a{padding:6px;font-size:10px}.crumb{font-size:11px}}
@media(max-width:345px){.country-switch a span{display:none}.country-switch a{font-size:16px}}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-logo">q<span>✳</span></span><div><strong><a class="qexus-home" href="https://qexus.github.io/" title="Все проекты qexus lab">qexus lab</a></strong><small>FISHERIES / NORWAY</small></div></div>
    <div class="aside-head">РАБОЧЕЕ ПРОСТРАНСТВО</div>
    <nav id="nav">
      <button class="nav-item active" data-view="dashboard"><span>◫</span> Обзор</button>
      <button class="nav-item" data-view="companies"><span>▦</span> Компании</button>
      <button class="nav-item" data-view="jobs"><span>▤</span> Вакансии</button>
      <button class="nav-item" data-view="fleets"><span>⚓</span> Флот</button>
      <div class="nav-rule"></div>
      <button class="nav-item" data-view="course"><span>◈</span> Курс · 10 уроков</button>
      <button class="nav-item" data-view="glossary"><span>▥</span> Словарь · 91 термин</button>
      <button class="nav-item" data-view="documents"><span>◩</span> Документы</button>
      <button class="nav-item" data-view="salary"><span>⊞</span> Калькулятор NOK</button>
      <button class="nav-item" data-view="import"><span>⇪</span> Импорт реестров</button>
    </nav>
    <div class="sidebar-bottom"><span class="status-dot"></span> PUBLIC DATA · НЕТ РАССЫЛКИ<br/><small>Данные сохраняются в этом браузере</small></div>
  </aside>
  <div class="main-wrap">
    <header class="topbar"><div class="crumb"><a class="qexus-home crumb-home" href="https://qexus.github.io/">qexus lab</a> <span>/</span> <span id="crumb">Обзор</span></div><div class="top-right"><nav class="country-switch" aria-label="Выбор страны"><a href="https://qexus.github.io/fisheries/" aria-current="page">🇳🇴 <span>Норвегия</span></a><a href="https://qexus.github.io/fisheries-ca/">🇨🇦 <span>Канада</span></a></nav><span class="pill version-pill">VER. 1.1</span></div></header>
    <main id="main" class="content"></main>
    <footer class="footer">qexus lab · самостоятельное исследование · 16.11.2026 · не является кадровым агентством или официальной сертификацией</footer>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
