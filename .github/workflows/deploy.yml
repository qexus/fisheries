name: Update registries and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1' # Every Monday at 07:17 UTC (best effort)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test data processing
        run: python -m unittest discover -s tests -v
      - name: Validate Academy curriculum and JavaScript
        run: |
          node tests/check_content.mjs
          for file in public/*.js; do node --check "$file"; done
      - name: Download public registries and build JSON
        shell: bash
        run: |
          set +e
          python scripts/build_registry.py --out public/generated/registry.json
          exit_code=$?
          if [ "$exit_code" -ne 0 ]; then
            echo '::warning::Both source downloads failed; using neutral empty snapshot.'
            # Existing seed companies, lessons, and local CSV import remain usable.
            python - <<'PY'
          import json
          from pathlib import Path
          target=Path('public/generated/registry.json')
          value=json.loads(target.read_text(encoding='utf-8'))
          value['status']='unavailable'
          target.write_text(json.dumps(value,ensure_ascii=False),encoding='utf-8')
          PY
          fi
      - name: Validate public assets and check for private filenames
        run: |
          test -s public/index.html
          test -s public/app.js
          test -s public/generated/registry.json
          python -m json.tool public/generated/registry.json > /dev/null
          if find public -type f \( -name '*.docx' -o -name '*.xlsx' -o -name '*backup*' -o -name '*.tar' \) | grep .; then
            echo 'Private or inappropriate data file found in public/'
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4