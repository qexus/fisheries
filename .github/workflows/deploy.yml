name: Update registries and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1' # Every Monday at 07:17 UTC (best effort)

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test data processing
        run: python -m unittest discover -s tests -v
      - name: Record official-source-only vacancy mode
        run: |
          python scripts/refresh_jobs.py --out public/generated/jobs.json
          python -m json.tool public/generated/jobs.json > /dev/null
      - name: Validate Academy curriculum and JavaScript
        run: |
          node tests/check_content.mjs
          node tests/check_locales.mjs
          node tests/check_switch_labels.mjs
          node tests/check_backup.mjs
          node tests/check_app_locales.mjs
          node tests/check_layout.mjs
          node tests/check_journey.mjs
          node tests/check_desk.mjs
          node tests/check_practicum.mjs
          node tests/check_source_quality.mjs
          node tests/check_public_privacy.mjs
          node tests/check_seo_meta.mjs public
          node tests/check_footer.mjs public
          node tests/check_local_assets.mjs public
          for file in public/*.js; do node --check "$file"; done
      - name: Download public registries and build JSON
        shell: bash
        run: |
          set +e
          python scripts/build_registry.py --out public/generated/registry.json
          exit_code=$?
          if [ "$exit_code" -ne 0 ]; then
            echo '::warning::Official downloads failed; attempting last published public snapshot.'
            python - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen
          target=Path('public/generated/registry.json')
          current=json.loads(target.read_text(encoding='utf-8'))
          try:
              url='https://qexus.github.io/fisheries/generated/registry.json'
              request=Request(url, headers={'User-Agent':'qexus-fisheries-snapshot-backup/1.0'})
              with urlopen(request, timeout=25) as response:
                  raw=response.read(8_000_001)
              if len(raw)>8_000_000: raise ValueError('Oversized snapshot')
              older=json.loads(raw)
              if not isinstance(older.get('companies'),list) or not isinstance(older.get('vessels'),list):
                  raise ValueError('Invalid snapshot')
              if len(older['companies'])<100 or len(older['vessels'])<50:
                  raise ValueError('Snapshot counts too low')
              older['status']='stale'
              older['note']='Downloads failed: retaining previously published dataset; not refreshed today.'
              older['errors']=current.get('errors',[])
              target.write_text(json.dumps(older,ensure_ascii=False),encoding='utf-8')
              print('Previous snapshot retained:',len(older['companies']),'companies,',len(older['vessels']),'vessels')
          except Exception as exc:
              current['status']='unavailable'
              current['note']='Download and previous snapshot failed; seed data still available.'
              target.write_text(json.dumps(current,ensure_ascii=False),encoding='utf-8')
              print('::warning::Snapshot recovery failed:',exc)
          PY
          fi
      - name: Security scan before publishing
        run: python scripts/security_audit.py
      - name: Validate public assets and check for private filenames
        run: |
          test -s public/index.html
          test -s public/app.js
          test -s public/generated/registry.json
          test -s public/generated/jobs.json
          python -m json.tool public/generated/registry.json > /dev/null
          if find public -type f \( -name '*.docx' -o -name '*.xlsx' -o -name '*backup*' -o -name '*.tar' \) | grep .; then
            echo 'Private or inappropriate data file found in public/'
            exit 1
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4